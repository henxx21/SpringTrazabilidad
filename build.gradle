plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jaroso'
version = '0.0.1-SNAPSHOT'
description = 'SpringTrazabilidades'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //dependencias para MapStruct
    implementation("org.mapstruct:mapstruct:1.5.5.Final")
    annotationProcessor("org.mapstruct:mapstruct-processor:1.5.5.Final")

    //dependencias para Hibernate Spatial
    implementation("org.hibernate.orm:hibernate-spatial:7.2.4.Final")
    implementation("org.locationtech.jts:jts-core:1.20.0")

    //dependencias para Spring Security y JWT
   // implementation("org.springframework.boot:spring-boot-starter-security:4.0.3")
   // testImplementation 'org.springframework.security:spring-security-test'
  //  implementation("io.jsonwebtoken:jjwt-api:0.13.0")
  //  runtimeOnly("io.jsonwebtoken:jjwt-impl:0.13.0")
  //  runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.13.0")
}

tasks.named('test') {
    useJUnitPlatform()
}
